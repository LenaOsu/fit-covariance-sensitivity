[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covsens"
version = "0.1.0"
description = "Impact of fit-parameter correlations on binned predictions (uncertainty propagation)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7", "pyyaml>=6.0"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
covsens = "covsens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
